---
layout: common
title: Search Results
permalink: /search/
---

<section class="micl-pane">
  <header class="micl-appbar">
    <button type="button" class="micl-appbar__leading-icon micl-iconbutton-standard-s material-symbols-outlined" command="show-modal" commandfor="hhrimenu">menu</button>
    <form action="{{ '/search/' | relative_url }}" method="get" class="micl-textfield-filled micl-search">
      <span class="micl-textfield__icon-leading material-symbols-outlined">search</span>
      <input type="text" name="q" placeholder="Search library">
      <span class="micl-textfield__icon-trailing"></span>
    </form>
    <div style="width:40px"></div>
  </header>
  <header>
    <div>
      <h1 class="md-sys-typescale-display-large">Search results</h1>
      <span id="hhri-searchcount" class="md-sys-typescale-headline-small">{{ page.subtitle }}</span>
    </div>
  </header>

  <div id="hhri-searchresults" class="hhri-theme-section">
    <p>Loading results...</p>
  </div>
</section>

<script>
document.addEventListener("DOMContentLoaded", function() {
  // 1. Get the search term from the URL (?q=...)
  const urlParams = new URLSearchParams(window.location.search);
  const query = urlParams.get('q');
  
  const displaySpan = document.querySelector('input[name=q]');
  const container = document.getElementById('hhri-searchresults');
  const countDisplay = document.getElementById('hhri-searchcount');

  if (!query) {
    displaySpan.textContent = "None";
    container.innerHTML = "<p>Please enter a search term.</p>";
    return;
  }

  displaySpan.textContent = query;
  const lowerQuery = query.toLowerCase();

  // 2. Fetch the JSON data
  fetch('{{ "/search.json" | relative_url }}')
    .then(response => response.json())
    .then(data => {
      // 3. Filter the articles
      const matches = data.filter(item => {
        return (item.title && item.title.toLowerCase().includes(lowerQuery)) ||
               (item.content && item.content.toLowerCase().includes(lowerQuery)) ||
               (item.keywords && item.keywords.toLowerCase().includes(lowerQuery));
      });

      countDisplay.textContent = matches.length + " article(s) found.";

      // 4. Render the Full Articles
      if (matches.length === 0) {
        container.innerHTML = "<p>No matching articles found.</p>";
        return;
      }

      let htmlTemplate = "";

      matches.forEach(item => {
        // Build the HTML for each full article, checking if metadata exists
        htmlTemplate += `
          <details class="micl-card-filled hhri-theme-item" tabindex="0">
            <summary>
              <span class="micl-card__headline-s">
                <span class="micl-heading md-sys-typescale-emphasized-headline-small">${item.title}</span>
              </span>
              <span class="micl-card__supporting-text">
                ${item.year ? `${item.year}` : ''}
                ${item.year && item.organization ? ' | ' : ''}
                ${item.organization ? `${item.organization}` : ''}
              </span>
            </summary>
            <div class="micl-card__content md-sys-typescale-body-medium">
              ${item.content.trim()}
              <hr class="micl-divider">
              <a href="${item.link}" class="micl-button-text-s" target="_blank">View Source</a>
            </div>
          </details>`;
      });

      // Inject the giant block of HTML into the page
      container.innerHTML = htmlTemplate;
    })
    .catch(error => {
      console.error("Error fetching search data:", error);
      container.innerHTML = "<p>Sorry, there was an error loading the search results.</p>";
    });
});
</script>
