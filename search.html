---
layout: default
title: Search Results
permalink: /search/
---

<div class="container">
  <h1>Search Results for: <span id="search-query-display"></span></h1>
  <p id="search-count"></p>
  
  <hr>

  <div id="full-results-container">
    <p>Loading results...</p>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
  // 1. Get the search term from the URL (?q=...)
  const urlParams = new URLSearchParams(window.location.search);
  const query = urlParams.get('q');
  
  const displaySpan = document.getElementById('search-query-display');
  const container = document.getElementById('full-results-container');
  const countDisplay = document.getElementById('search-count');

  if (!query) {
    displaySpan.textContent = "None";
    container.innerHTML = "<p>Please enter a search term.</p>";
    return;
  }

  displaySpan.textContent = query;
  const lowerQuery = query.toLowerCase();

  // 2. Fetch the JSON data
  fetch('{{ "/search.json" | relative_url }}')
    .then(response => response.json())
    .then(data => {
      // 3. Filter the articles
      const matches = data.filter(item => {
        return (item.title && item.title.toLowerCase().includes(lowerQuery)) ||
               (item.content && item.content.toLowerCase().includes(lowerQuery)) ||
               (item.keywords && item.keywords.toLowerCase().includes(lowerQuery));
      });

      countDisplay.textContent = matches.length + " article(s) found.";

      // 4. Render the Full Articles
      if (matches.length === 0) {
        container.innerHTML = "<p>No matching articles found.</p>";
        return;
      }

      let htmlTemplate = "";

      matches.forEach(item => {
        // Build the HTML for each full article, checking if metadata exists
        htmlTemplate += `
          <article class="search-result-full" style="margin-bottom: 3rem; padding: 1.5rem; background: #f9f9f9; border-radius: 8px;">
            <h2>${item.title}</h2>
            
            <div class="article-metadata" style="font-size: 0.9em; color: #555; margin-bottom: 1rem;">
              ${item.year ? `<strong>Year:</strong> ${item.year} <br>` : ''}
              ${item.organization ? `<strong>Organization:</strong> ${item.organization} <br>` : ''}
              ${item.countries ? `<strong>Countries:</strong> ${item.countries} <br>` : ''}
              ${item.category ? `<strong>Category:</strong> ${item.category} <br>` : ''}
            </div>

            <div class="article-content" style="margin-bottom: 1rem;">
              ${item.content}
            </div>

            ${item.link ? `<a href="${item.link}" target="_blank" style="display: inline-block; padding: 10px 15px; background: #0056b3; color: white; text-decoration: none; border-radius: 4px;">External Link &rarr;</a>` : ''}
          </article>
        `;
      });

      // Inject the giant block of HTML into the page
      container.innerHTML = htmlTemplate;
    })
    .catch(error => {
      console.error("Error fetching search data:", error);
      container.innerHTML = "<p>Sorry, there was an error loading the search results.</p>";
    });
});
</script>
