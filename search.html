---
layout: common
title: Search Results
permalink: /search/
---

<section class="micl-pane">
  <header class="micl-appbar">
    <button type="button" class="micl-appbar__leading-icon micl-iconbutton-standard-s material-symbols-outlined" command="show-modal" commandfor="hhrimenu">menu</button>
    <form action="{{ '/search/' | relative_url }}" method="get" class="micl-textfield-filled micl-search">
      <span class="micl-textfield__icon-leading material-symbols-outlined">search</span>
      <input type="text" name="q" autofocus placeholder="Search library">
      <span class="micl-textfield__icon-trailing"></span>
    </form>
    <div style="width:40px"></div>
  </header>
  <header style="justify-content:center;text-align:center">
    <div>
      <h1 class="md-sys-typescale-display-large">Search results</h1>
      <span id="hhri-searchcount" class="md-sys-typescale-headline-small">{{ page.subtitle }}</span>
    </div>
  </header>

  <div id="hhri-searchresults" class="hhri-theme-section">
    <p>Loading results...</p>
  </div>
</section>

<script>
document.addEventListener("DOMContentLoaded", function()
{
  const urlParams = new URLSearchParams(window.location.search);
  const searchterm = urlParams.get('q');
  
  const input = document.querySelector('input[name=q]');
  const container = document.getElementById('hhri-searchresults');
  const countDisplay = document.getElementById('hhri-searchcount');

  if (!searchterm) {
    input.textContent = "None";
    container.innerHTML = "<p>Please enter a search term.</p>";
    return;
  }
  input.value = searchterm;

  // foo bar: matches both 'foo' and 'bar'
  // "foo bar": matches "foo bar" exactly
  // foo OR bar: matches either 'foo' or 'bar'
  // -foo: exclude text containing 'foo'
  const searchMatch = (text, query) =>
  {
    const lowerText = text.toLowerCase();
    
    // 1. Tokenize the query using a Regular Expression
    // Matches: 
    // group 1: excluded phrase -"..."
    // group 2: excluded word -...
    // group 3: exact phrase "..."
    // group 4: normal word ...
    const regex = /-"([^"]+)"|-([^\s]+)|"([^"]+)"|([^\s]+)/g;
    const tokens = [];
    let match;

    while ((match = regex.exec(query)) !== null) {
      if (match[1]) tokens.push({ type: 'exclude', value: match[1] });
      else if (match[2]) tokens.push({ type: 'exclude', value: match[2] });
      else if (match[3]) tokens.push({ type: 'require', value: match[3] });
      else if (match[4]) {
        if (match[4] === 'OR') {
          tokens.push({ type: 'OR' });
        } else {
          tokens.push({ type: 'require', value: match[4] });
        }
      }
    }

    // 2. Split tokens into groups separated by 'OR'
    const orGroups = [];
    let currentGroup = [];

    for (const token of tokens) {
      if (token.type === 'OR') {
        if (currentGroup.length > 0) {
          orGroups.push(currentGroup);
          currentGroup = [];
        }
      } else {
        currentGroup.push(token);
      }
    }
    if (currentGroup.length > 0) {
      orGroups.push(currentGroup);
    }

    // 3. Evaluate the logic: At least one OR group must be completely true
    return orGroups.some(group => {
      // Within an AND group, every token's condition must be met
      return group.every(token => {
        const term = token.value.toLowerCase();
        const contains = lowerText.includes(term);
        
        return token.type === 'require' ? contains : !contains;
      });
    });
  };

  // 2. Fetch the JSON data
  fetch('{{ "/search.json" | relative_url }}')
    .then(response => response.json())
    .then(data => {
      // 3. Filter the articles
      const matches = data.filter(item =>
      {
        return searchMatch(item.title, searchterm)
               || searchMatch(item.content, searchterm)
               || searchMatch(item.keywords, searchterm);
      });

      countDisplay.textContent = matches.length + " article(s) found";

      // 4. Render the Full Articles
      if (matches.length === 0) {
        container.innerHTML = "<p>No matching articles found</p>";
        return;
      }

      let htmlTemplate = "";

      matches.forEach(item => {
        // Build the HTML for each full article, checking if metadata exists
        htmlTemplate += `<details class="micl-card-filled hhri-theme-item" tabindex="0">
<summary>
  <span class="micl-card__headline-s">
    <span class="micl-heading md-sys-typescale-emphasized-headline-small">${item.title}</span>
  </span>
  <span class="micl-card__supporting-text">
    ${item.year ? `${item.year}` : ''}
    ${item.year && item.organization ? ' | ' : ''}
    ${item.organization ? `${item.organization}` : ''}
  </span>
</summary>
<div class="micl-card__content md-sys-typescale-body-medium">
  ${item.content.trim()}
  <hr class="micl-divider">
  <a href="${item.link}" class="micl-button-text-s" target="_blank">View Source</a>
</div>
</details>`;
      });

      // Inject the giant block of HTML into the page
      container.innerHTML = htmlTemplate;
    })
    .catch(error => {
      container.innerHTML = "<p>Sorry, there was an error loading the search results.</p>";
    });
});
</script>
